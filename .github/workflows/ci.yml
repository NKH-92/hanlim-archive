name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: required / verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloudflare-app/package-lock.json
      - name: Verify released migrations against trusted base
        env:
          RELEASED_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-released-baseline-history.mjs --base-ref "$RELEASED_BASE_SHA"
      - run: npm ci
      - name: Verify source, contracts, migrations, and tests
        run: npm run verify
      - name: Dependency audit
        run: |
          mkdir -p release-evidence
          npm run audit:dependencies
          npm audit --json > release-evidence/dependency-audit.json
      - name: Migration and schema evidence
        run: npm run release:evidence -- --out release-evidence
      - name: Worker dry-run and bundle report
        env:
          CLOUDFLARE_ENV: production
          D1_TARGET_DATABASE_ID: a07324c0-7547-48a6-836e-3f0c50b85c36
        run: |
          set -o pipefail
          npm run deploy:dry 2>&1 | tee release-evidence/bundle-report.txt
      - name: Upload CI evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-${{ github.sha }}
          path: cloudflare-app/release-evidence/
          if-no-files-found: error
          retention-days: 7
